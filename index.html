html,body{margin:0;height:100%;color:var(--ink);font-family:Sriracha,"Noto Sans Thai",Tahoma,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100svh;
 background:radial-gradient(120% 80% at 50% 45%,#1a1450 0%,#0b0828 55%,#05031a 100%)}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
header,footer{position:relative;z-index:3;text-align:center;padding:30px 16px 0}
.brand{font:700 12px Cinzel,serif;letter-spacing:.4em;color:#b9b2ff;opacity:.85}
h1{font:400 clamp(18px,5vw,24px)/1.5 Sriracha,sans-serif;margin:0;color:#fff;text-shadow:0 0 12px rgba(160,140,255,.6)}
.info{font-size:14px;color:var(--muted);line-height:1.6;min-height:1.6em}
footer{padding:4px 16px calc(14px + env(safe-area-inset-bottom))}
.deck-left{font-size:12.5px;line-height:1.6;color:#cbbfff;opacity:.85;min-height:1.6em}
.hint{margin:0 0 8px;font-size:15px;line-height:1.6;color:#d8d2ff}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-size:13.5px;line-height:1.5;color:#efeaff;background:rgba(255,255,255,.07);border:1px solid rgba(200,190,255,.32);
 padding:8px 13px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);transition:background .2s,border-color .2s}
button:hover{background:rgba(255,255,255,.14);border-color:rgba(220,210,255,.6)}
button:focus-visible,.card:focus-visible{outline:2px solid #9fd8ff;outline-offset:4px}
.stage{position:relative;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;z-index:2;
 --rx:0;--ry:0;--px:50;--py:50;--bp:50;--holo:.25;--spin:0}
.glow{position:absolute;left:50%;top:50%;width:calc(var(--cw)*1.9);height:calc(var(--ch)*1.45);transform:translate(-50%,-50%);
 background:radial-gradient(closest-side,rgba(150,110,255,.55),rgba(60,170,255,.22) 55%,transparent);filter:blur(12px);
 opacity:calc(.4 + var(--holo)*.55);animation:pulse 5s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.07)}}
.beam{position:absolute;left:50%;top:50%;width:calc(var(--cw)*1.35);height:calc(var(--ch)*1.7);pointer-events:none;opacity:0;
 transform:translate(-50%,calc(var(--ch)*.5 + 14px - 100%));transform-origin:50% 100%;mix-blend-mode:screen;filter:blur(5px);
 clip-path:polygon(40% 100%,60% 100%,100% 0,0 0);
 background:linear-gradient(to top,rgba(220,245,255,.95) 0%,rgba(150,210,255,.6) 12%,rgba(190,150,255,.28) 50%,transparent 100%)}
.beam.go{animation:beam 1.3s ease-out}
@keyframes beam{0%{opacity:0;transform:translate(-50%,calc(var(--ch)*.5 + 14px - 100%)) scaleY(.05)}
 25%{opacity:1}100%{opacity:0;transform:translate(-50%,calc(var(--ch)*.5 + 14px - 100%)) scaleY(1.1)}}
.card{position:relative;width:var(--cw);height:var(--ch);perspective:calc(var(--cw)*3.2);touch-action:none;cursor:pointer;z-index:2;
 -webkit-tap-highlight-color:transparent;--rad:calc(var(--cw)*.06);border-radius:var(--rad)}
.card *{pointer-events:none}
.float,.tilt,.spin{position:absolute;inset:0;transform-style:preserve-3d}
.float{transition:transform .8s ease}
.float.idle{animation:floaty 4.6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(-2%)}50%{transform:translateY(2%)}}
.tilt{transform:rotateX(calc(var(--rx)*1deg)) rotateY(calc(var(--ry)*1deg))}
.spin{transform:rotateY(calc(var(--spin)*1deg))}
.edge{position:absolute;inset:0;border-radius:var(--rad);background:linear-gradient(135deg,#eef1f7,#8a90a0 40%,#d5d9e2 60%,#767c8c)}
.face{position:absolute;inset:0;border-radius:var(--rad);overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;isolation:isolate}
.front{transform:translateZ(2.5px);box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 30px rgba(120,100,255,.25)}
.back{transform:rotateY(180deg) translateZ(2.5px)}
.face img{position:absolute;inset:0;width:100%;height:100%;display:block}
.holo{position:absolute;inset:0;pointer-events:none}
.rainbow{background:repeating-linear-gradient(115deg,hsl(0 100% 62%) 0%,hsl(45 100% 60%) 6%,hsl(110 100% 60%) 12%,hsl(185 100% 60%) 18%,hsl(255 100% 68%) 24%,hsl(315 100% 62%) 30%,hsl(360 100% 62%) 36%);
 background-size:300% 300%;background-position:calc(var(--px)*1%) calc(var(--py)*1%);mix-blend-mode:color-dodge;opacity:calc(var(--holo)*.32)}
.irid{background:linear-gradient(calc(var(--px)*1.4deg + 20deg),rgba(150,80,255,.65),rgba(60,255,170,.45),rgba(255,90,200,.6),rgba(80,160,255,.55));
 background-size:200% 200%;background-position:calc(100% - var(--px)*1%) calc(var(--py)*1%);mix-blend-mode:overlay;opacity:calc(var(--holo)*.6)}
.sparkle{background-image:radial-gradient(circle,#fff 0 .7px,transparent 1.4px),radial-gradient(circle,#dff 0 .5px,transparent 1.2px);
 background-size:13px 17px,23px 19px;background-position:calc(var(--px)*.3px) calc(var(--py)*.2px),calc(var(--px)*-.25px) calc(var(--py)*.35px);
 mix-blend-mode:color-dodge;opacity:calc(var(--holo)*.7);
 -webkit-mask-image:radial-gradient(circle at calc(var(--px)*1%) calc(var(--py)*1%),#000 0%,transparent 55%);
 mask-image:radial-gradient(circle at calc(var(--px)*1%) calc(var(--py)*1%),#000 0%,transparent 55%)}
.scan{background:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 1px,transparent 1px 3px);mix-blend-mode:overlay;opacity:calc(.25 + var(--holo)*.45)}
.band{background:linear-gradient(115deg,transparent calc(var(--bp)*1% - 32%),rgba(0,0,0,.3) calc(var(--bp)*1% - 12%),
 rgba(255,255,255,.7) calc(var(--bp)*1%),rgba(0,0,0,.22) calc(var(--bp)*1% + 10%),transparent calc(var(--bp)*1% + 26%));
 mix-blend-mode:overlay;opacity:calc(.3 + var(--holo)*.7)}
.spot{background:radial-gradient(circle at calc(var(--px)*1%) calc(var(--py)*1%),rgba(255,255,255,.8) 0%,rgba(255,255,255,.18) 18%,transparent 45%);
 mix-blend-mode:overlay;opacity:calc(.2 + var(--holo)*.8)}
.tw{position:absolute;width:calc(var(--cw)*.075);height:calc(var(--cw)*.075);opacity:0;mix-blend-mode:screen;
 clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);
 background:radial-gradient(circle,#fff 0 20%,#c8f4ff 45%,rgba(200,170,255,.6) 70%,transparent 75%)}
.sweep{position:absolute;left:0;right:0;bottom:-14%;height:14%;opacity:0;mix-blend-mode:screen;
 background:linear-gradient(to top,transparent,rgba(160,240,255,.25) 35%,rgba(235,252,255,.95) 50%,rgba(200,170,255,.3) 65%,transparent)}
.sweep.go{animation:sweep 1.15s cubic-bezier(.3,.6,.3,1)}
@keyframes sweep{0%{opacity:0;transform:translateY(0)}10%{opacity:1}100%{opacity:0;transform:translateY(-830%)}}
.numeral{position:absolute;left:50%;top:3%;width:18.7%;height:4.8%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;
 font:700 calc(var(--cw)*.048)/1 Cinzel,serif;color:#eef1f8;letter-spacing:.06em;z-index:5}
.name{position:absolute;left:6%;right:6%;top:82.9%;height:5.4%;display:flex;align-items:center;justify-content:center;z-index:5}
.name span{display:inline-block;white-space:nowrap;font:700 calc(var(--cw)*.05)/1.2 Cinzel,serif;letter-spacing:.1em;color:#f4e7c2;
 text-shadow:0 1px 0 #000,0 0 8px rgba(255,210,140,.55)}
.fortune{position:absolute;left:5%;right:5%;top:88.2%;height:9.2%;display:flex;align-items:center;justify-content:center;z-index:5}
.fortune::before{content:'';position:absolute;inset:-8% -3%;z-index:-1;opacity:0;transition:opacity .6s;
 background:radial-gradient(closest-side,rgba(6,4,18,.85),rgba(6,4,18,.55) 65%,transparent)}
.fortune.lit::before{opacity:1}
.fortune span{display:inline-block;white-space:nowrap;line-height:1.65;padding:0 .1em;color:#fff8ea;opacity:0;font-family:Sriracha,"Noto Sans Thai",sans-serif;
 text-shadow:0 0 4px #fff,0 0 10px rgba(255,170,90,.9),0 0 20px rgba(255,90,170,.6),0 0 30px rgba(90,180,255,.55)}
.fortune span.show{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{0%{opacity:0;transform:translateY(55%);filter:blur(5px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
dialog{background:#120e30;color:var(--ink);border:1px solid rgba(180,170,255,.3);border-radius:18px;padding:0;width:min(600px,92vw);max-height:84vh;max-height:84svh;overflow:hidden}
dialog::backdrop{background:rgba(3,2,15,.7);backdrop-filter:blur(3px)}
.dlg{display:flex;flex-direction:column;max-height:84vh;max-height:84svh}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid rgba(180,170,255,.2)}
.dlg-h b{font-weight:400;font-size:18px}
.dlg-b{overflow:auto;padding:8px 16px 18px}
.dlg-b h3{font-weight:400;font-size:15px;color:#cbbfff;margin:14px 0 6px}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.pk button{border-radius:10px;text-align:left;padding:6px 10px;font-size:14px}
.pk small{display:block;font:500 10px Cinzel,serif;letter-spacing:.05em;color:var(--muted)}
.pk button.on{border-color:#9fd8ff;background:rgba(120,190,255,.18)}
button.primary{background:linear-gradient(135deg,rgba(150,100,255,.55),rgba(60,170,255,.45));border-color:rgba(210,200,255,.7);
 box-shadow:0 0 16px rgba(150,120,255,.45);font-size:14.5px;padding:8px 16px}
button.primary:hover{background:linear-gradient(135deg,rgba(170,120,255,.7),rgba(80,190,255,.6))}
button:disabled{opacity:.6;cursor:default}
button.busy .ic{display:inline-block;animation:spinic .8s linear infinite}
@keyframes spinic{to{transform:rotate(360deg)}}
.card{transition:opacity .3s}
/* rainbow-arc spinner */
.arcfx{position:absolute;left:0;right:0;top:0;height:var(--pv,50%);overflow:hidden;z-index:4;pointer-events:none;opacity:0;transition:opacity .35s}
.arcfx.on{opacity:1}
.rainbow-arc{position:absolute;left:50%;top:100%;width:calc(var(--R,200)*2px + var(--rh,100px)*1.5);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;filter:blur(5px);
 background:radial-gradient(circle closest-side,transparent 64%,rgba(255,70,80,.6) 69%,rgba(255,160,50,.6) 74%,rgba(255,230,70,.55) 79%,rgba(80,220,130,.55) 84%,rgba(70,160,255,.55) 89%,rgba(160,100,255,.55) 94%,transparent 99%)}
.ring{position:absolute;left:50%;top:100%;width:0;height:0}
.rc{position:absolute;left:calc(var(--rw)*-.5);top:calc(var(--rh)*-.5);width:var(--rw);height:var(--rh);
 transform:rotate(calc(var(--a)*1deg)) translateY(calc(var(--R)*-1px))}
.rc img{width:100%;height:100%;display:block;border-radius:8%/5%;box-shadow:0 6px 16px rgba(0,0,0,.5);transition:transform .15s,filter .15s}
.rc.top img{transform:scale(1.18) translateY(-6%);filter:brightness(1.3) drop-shadow(0 0 10px #fff3c0)}
.rc.chosen img{animation:chosen .65s ease-in-out}
@keyframes chosen{50%{transform:scale(1.45) translateY(-14%);filter:brightness(1.7) drop-shadow(0 0 22px #fff6d0)}}
.arc-ptr{position:absolute;left:50%;transform:translateX(-50%);z-index:5;color:#ffe9a3;font-size:20px;line-height:1;opacity:0;transition:opacity .35s;
 text-shadow:0 0 10px #ffd35a,0 0 20px #ff8ad9;pointer-events:none}
.arcfx.on~.arc-ptr{opacity:1;animation:ptr .5s ease-in-out infinite alternate}
@keyframes ptr{to{transform:translate(-50%,5px)}}
/* หวาน standee */
.wan-tag{text-align:center;font-size:15px;line-height:1.6;color:#fff;margin-top:2px;white-space:nowrap;text-shadow:0 0 8px rgba(255,150,200,.9),0 0 16px rgba(120,180,255,.7)}
#three3d{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.chibi-tag{position:absolute;z-index:6;transform:translate(-50%,2px);pointer-events:none;margin:0;transition:opacity .3s}
.chibi-tag.small{font-size:11.5px}
/* Christmas reveal effects */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
.rays{position:absolute;left:50%;top:50%;width:calc(var(--cw)*3.2);aspect-ratio:1;border-radius:50%;pointer-events:none;opacity:0;mix-blend-mode:screen;transform:translate(-50%,-50%);
 background:repeating-conic-gradient(from 0deg,rgba(255,215,120,0) 0deg 5deg,rgba(255,225,140,.55) 8deg,rgba(255,215,120,0) 11deg 18deg);
 -webkit-mask:radial-gradient(closest-side,#000 18%,transparent 78%);mask:radial-gradient(closest-side,#000 18%,transparent 78%)}
.rays.go{animation:rays 3s ease-out}
@keyframes rays{0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.5)}18%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(50deg) scale(1.15)}}
.shock{position:absolute;left:50%;top:50%;width:var(--cw);aspect-ratio:1;border-radius:50%;pointer-events:none;opacity:0;z-index:3;transform:translate(-50%,-50%);
 border:3px solid rgba(255,244,210,.95);box-shadow:0 0 30px #ffd35a,0 0 60px rgba(232,52,78,.6),inset 0 0 30px rgba(63,199,122,.6)}
.shock.go{animation:shock 1.2s cubic-bezier(.2,.7,.3,1)}
@keyframes shock{0%{opacity:1;transform:translate(-50%,-50%) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.2)}}
.xmas-banner{position:absolute;left:50%;top:calc(50% - var(--ch)*.3);transform:translate(-50%,-50%);z-index:7;pointer-events:none;opacity:0;white-space:nowrap;
 font:700 clamp(18px,calc(var(--cw)*.11),40px)/1.2 Cinzel,serif;letter-spacing:.06em;color:#ffe9a3;
 text-shadow:0 0 6px #fff3c0,0 0 18px #ffb02e,0 0 34px rgba(232,52,78,.8),0 0 50px rgba(63,199,122,.6)}
.xmas-banner.go{animation:banner 3.2s ease-out}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-10%) scale(.4)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.front.party{animation:party 1.8s ease-out}
@keyframes party{0%{box-shadow:0 0 0 rgba(0,0,0,0)}20%{box-shadow:0 0 40px 10px rgba(255,211,90,.95),0 0 90px 30px rgba(232,52,78,.55)}55%{box-shadow:0 0 50px 14px rgba(63,199,122,.8),0 0 100px 34px rgba(255,211,90,.5)}100%{box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 30px rgba(120,100,255,.25)}}
#xmas.party .bulb{animation-duration:.35s!important}
/* item 13: each card's aura + its spirit rising out of the card */
.aura{position:absolute;left:50%;top:50%;width:calc(var(--cw)*2.2);height:calc(var(--ch)*1.55);transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:1;opacity:0;
 background:radial-gradient(closest-side,var(--a1,#a08aff) 0%,var(--a2,#4fd1ff) 42%,transparent 78%);filter:blur(22px);mix-blend-mode:screen;transition:opacity .9s}
.aura.on{opacity:.55;animation:auraPulse 2.6s ease-in-out infinite}
.aura.on.burst{animation:auraBurst 1.8s ease-out,auraPulse 2.6s ease-in-out 1.8s infinite}
@keyframes auraPulse{50%{transform:translate(-50%,-50%) scale(1.07);opacity:.7}}
@keyframes auraBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}}
.spirit{position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);transform:translate(-50%,-50%);pointer-events:none;z-index:6;opacity:0;
 filter:drop-shadow(0 0 8px var(--a1,#fff)) drop-shadow(0 0 22px var(--a2,#fff)) brightness(1.12)}
.spirit.go{animation:spirit 3.6s cubic-bezier(.2,.8,.3,1)}
@keyframes spirit{0%{opacity:0;transform:translate(-50%,-50%) scale(1)}10%{opacity:.95}35%{opacity:1;transform:translate(-50%,-64%) scale(1.32)}72%{opacity:.9;transform:translate(-50%,-61%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
/* Christmas scenery */
#xmas{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#xmas svg{position:absolute;left:0;display:block}
#xmas .lights{top:0}
#xmas .hills{bottom:0}
.bulb{animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.stage.shuffling .glow{opacity:1;filter:blur(16px) hue-rotate(40deg)}
.hint .dots::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:dots 1s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;background:rgba(20,16,50,.92);
 border:1px solid rgba(180,170,255,.35);padding:8px 16px;border-radius:12px;font-size:14px;line-height:1.6;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* reduced motion: only ambient loops stop; things the user starts (spins, carousel, beam, fortune) still play */
@media (prefers-reduced-motion:reduce){
 .float.idle,.glow,.bulb{animation:none}
}
@keyframes fade{to{opacity:1}}
/* drawn pile (bottom-left) + history list */
.pile{position:absolute;left:max(12px,calc(50% - var(--cw)*.5 - var(--cw)*.55));bottom:10px;z-index:7;width:clamp(54px,calc(var(--cw)*.3),110px);aspect-ratio:3/5;padding:0;border:0;background:none;border-radius:8px;cursor:pointer;transition:opacity .4s}
.pile.empty{opacity:0;pointer-events:none}
.pile-stack img{position:absolute;inset:0;width:100%;height:100%;border-radius:7%/4%;box-shadow:0 4px 12px rgba(0,0,0,.55);transform:translate(calc(var(--i)*2px),calc(var(--i)*-3px)) rotate(var(--r))}
.pile-n{position:absolute;right:-8px;top:-8px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#e8344e;color:#fff;font:700 13px/24px Cinzel,serif;box-shadow:0 0 10px rgba(232,52,78,.8)}
.pile-label{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;line-height:1.6;color:#e7e0ff;text-shadow:0 1px 3px #000}
.pile.bump{animation:pbump .45s ease-out}
@keyframes pbump{40%{transform:scale(1.15) rotate(-3deg)}}
.pile-fly{position:fixed;z-index:20;pointer-events:none;border-radius:6%/3.6%;transform-origin:center;box-shadow:0 10px 30px rgba(0,0,0,.6);transition:transform .7s cubic-bezier(.55,0,.3,1)}
.hist{position:fixed;inset:0;z-index:30;background:rgba(3,2,15,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.hist[hidden]{display:none}
.hist-box{background:#120e30;border:1px solid rgba(180,170,255,.3);border-radius:16px;width:min(560px,calc(100vw - 32px));max-height:84vh;max-height:84svh;display:flex;flex-direction:column;overflow:hidden}
.hist-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid rgba(180,170,255,.2);font-size:16px;line-height:1.6}
.hist-h b{font-weight:400}
.hist-list{overflow:auto;padding:8px 12px 14px}
.hist-item{display:flex;gap:12px;align-items:center;padding:8px 4px;border-bottom:1px solid rgba(180,170,255,.12)}
.hist-item img{width:52px;aspect-ratio:3/5;border-radius:5px;flex:none}
.hist-item b{font-weight:400;font-size:15px;line-height:1.6;display:block}
.hist-item small{font:500 10.5px Cinzel,serif;color:#a49dd6;display:block}
.hist-item p{margin:2px 0 0;font-size:13.5px;line-height:1.7;color:#ffe9c4}
.hint{overflow-wrap:anywhere;max-width:calc(100vw - 32px);margin-left:auto;margin-right:auto}
/* ===== item 18/20: rarity, foil, picker & shop ===== */
.cbadge{position:absolute;right:5%;top:2.6%;z-index:6;font:700 calc(var(--cw)*.04)/1.4 Cinzel,serif;padding:0 .5em;border-radius:1em;background:rgba(10,8,30,.75);border:1px solid rgba(255,255,255,.35);letter-spacing:.04em}
.front.foil-r .rainbow{opacity:calc(var(--holo)*.3)}
.front.foil-sr .rainbow{opacity:calc(var(--holo)*.45)}
.front.foil-ur .rainbow{opacity:calc(var(--holo)*.6)}
.front.foil-ur .sparkle{opacity:calc(var(--holo)*.95)}
.front.foil-sp .rainbow{opacity:calc(var(--holo)*.85)}
.front.foil-sp .sparkle{opacity:var(--holo)}
.ovl{position:fixed;inset:0;z-index:30;background:rgba(3,2,15,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.ovl[hidden]{display:none}
.ovl-box{background:#120e30;border:1px solid rgba(180,170,255,.3);border-radius:16px;width:min(900px,calc(100vw - 32px));max-height:88vh;max-height:88svh;display:flex;flex-direction:column;overflow:hidden}
.ovl-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(180,170,255,.2);line-height:1.6;flex-wrap:wrap}
.ovl-h b{font-weight:400;font-size:17px}
.ovl-sub{flex:1;font-size:12.5px;color:#cbbfff}
.ovl-tabs{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap}
.ovl-tabs:empty{display:none}
.ovl-tabs button.on,.chips button.on{background:rgba(120,190,255,.22);border-color:#9fd8ff}
.ovl-body{overflow:auto;padding:10px 14px 18px}
.ovl-body h3{font-weight:400;font-size:16px;margin:12px 0 6px;color:#e6dcff;line-height:1.6}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.tbtn,.shelf{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(200,190,255,.15);position:relative}
.tbtn{cursor:pointer}
.tbtn:hover{border-color:#9fd8ff}
.shelf.miss .tc{filter:grayscale(1) brightness(.4)}
.tn{font-size:12px;line-height:1.5;text-align:center;color:#ece8ff}
.own{font-size:11px;color:#9fe0b0}
.tc{position:relative;width:100%;aspect-ratio:3/5;border-radius:6px;overflow:hidden}
.tc img{width:100%;height:100%;display:block}
.tc .rb{position:absolute;right:3px;top:3px;font:700 9.5px/1.5 Cinzel,serif;padding:0 5px;border-radius:8px;background:rgba(10,8,30,.8)}
.tc.r0 .rb{color:#d7dcea}
.tc.r1 .rb{color:#5fb4ff}
.tc.r2 .rb{color:#b58cff}
.tc.r3 .rb{color:#ffd35a}
.tc.r4 .rb{color:#ff6fd8}
.tc.r2::after,.tc.r3::after,.tc.r4::after{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;background-size:300% 300%;animation:foil 4s linear infinite;
 background-image:linear-gradient(115deg,transparent 20%,rgba(255,80,80,.35) 30%,rgba(255,230,90,.35) 38%,rgba(80,255,170,.35) 46%,rgba(90,170,255,.4) 54%,rgba(200,110,255,.35) 62%,transparent 72%)}
.tc.r3::after,.tc.r4::after{background-image:linear-gradient(115deg,transparent 10%,rgba(255,80,80,.55) 22%,rgba(255,230,90,.55) 32%,rgba(80,255,170,.55) 42%,rgba(90,170,255,.6) 52%,rgba(200,110,255,.55) 62%,rgba(255,120,200,.5) 72%,transparent 84%),radial-gradient(circle,#fff 0 .8px,transparent 1.5px);background-size:300% 300%,11px 13px}
.tc.r1{box-shadow:0 0 6px rgba(95,180,255,.45)}
.tc.r2{box-shadow:0 0 9px rgba(181,140,255,.65)}
.tc.r3{box-shadow:0 0 12px rgba(255,211,90,.7)}
.tc.r4{box-shadow:0 0 14px 2px rgba(255,111,216,.85);animation:spglow 2.4s ease-in-out infinite}
@keyframes spglow{50%{box-shadow:0 0 20px 5px rgba(120,230,255,.9)}}
@keyframes foil{to{background-position:300% 0,0 0}}
.new{position:absolute;left:3px;bottom:3px;font:700 9px/1.6 Cinzel,serif;color:#fff;background:#e8344e;padding:0 5px;border-radius:6px}
.chip{font:700 11px Cinzel,serif;padding:1px 6px;border-radius:8px;background:rgba(10,8,30,.8)}
.chip.r0{color:#d7dcea}
.chip.r1{color:#5fb4ff}
.chip.r2{color:#b58cff}
.chip.r3{color:#ffd35a}
.chip.r4{color:#ff6fd8}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.prod{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.prod>div:last-child{flex:1;min-width:220px}
.prod p,.note{font-size:13.5px;line-height:1.7;color:#d8d2ff;margin:4px 0}
.note small,.rtab small{color:#9a93c9}
.buy{background:linear-gradient(135deg,#e8344e,#b81f5a);border-color:#ffb0c0;font-size:14.5px;padding:8px 16px;margin-top:6px}
.buy.sm{font-size:12px;padding:4px 10px;margin:0}
.buy.ghost{background:rgba(255,255,255,.07);border-color:rgba(200,190,255,.32)}
.packart{width:110px;aspect-ratio:3/5;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden;
 background:linear-gradient(150deg,#3a1a8a,#c22f5a 45%,#e8344e 55%,#2fa36b);box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 0 3px rgba(255,255,255,.35)}
.packart.box{width:150px;aspect-ratio:4/3;background:linear-gradient(150deg,#1a2e8a,#6a3fd0 50%,#ffd35a)}
.packart.set{width:150px;aspect-ratio:4/3;background:linear-gradient(150deg,#0b3324,#2f9a6e 45%,#ffd35a)}
.packart span{font:700 20px Cinzel,serif;letter-spacing:.12em;color:#fff3c0;text-shadow:0 0 10px #ffd35a}
.packart small{font:700 9px Cinzel,serif;color:#fff;letter-spacing:.08em;text-align:center}
.packart::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);background-size:300% 100%;animation:foil 3s linear infinite;mix-blend-mode:overlay}
.rtab{width:100%;border-collapse:collapse;font-size:13px;line-height:1.6;margin-top:8px}
.rtab th,.rtab td{padding:6px 8px;border-bottom:1px solid rgba(180,170,255,.15);text-align:left}
.rtab th{color:#cbbfff;font-weight:400}
.po{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0;min-height:360px}
.po-pack{width:150px;aspect-ratio:3/5;border-radius:12px;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
 background:linear-gradient(150deg,#3a1a8a,#c22f5a 45%,#e8344e 55%,#2fa36b);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 30px rgba(255,211,90,.4),inset 0 0 0 3px rgba(255,255,255,.35);animation:wob 1.2s ease-in-out infinite}
.po-pack span{font:700 24px Cinzel,serif;letter-spacing:.12em;color:#fff3c0;text-shadow:0 0 10px #ffd35a}
.po-pack small{font-size:12px;color:#fff}
.po-top{position:absolute;left:0;right:0;top:0;height:16%;border-radius:12px 12px 0 0;background:linear-gradient(90deg,#ffd35a,#fff3c0,#ffd35a);border-bottom:2px dashed rgba(0,0,0,.35)}
@keyframes wob{50%{transform:rotate(2deg) scale(1.03)}}
.po.torn .po-pack{display:none}
.po-cards{display:none;gap:10px;justify-content:center;flex-wrap:wrap}
.po.torn .po-cards{display:flex;animation:cardsIn .5s ease-out}
@keyframes cardsIn{from{opacity:0;transform:translateY(40px)}}
.pc{width:min(110px,16vw);aspect-ratio:3/5;position:relative}
.pc-in{position:relative;width:100%;height:100%}
.pc-b,.pc-f{position:absolute;inset:0;width:100%;height:100%;border-radius:6px}
.pc-f{display:none}
.pc.flipping{animation:flp .36s ease-in-out}
.pc.flip .pc-b{display:none}
.pc.flip .pc-f{display:block}
@keyframes flp{50%{transform:scaleX(0)}}
.pc.pglow.r2 .tc{box-shadow:0 0 18px 5px rgba(181,140,255,.85)}
.pc.pglow.r3 .tc{box-shadow:0 0 26px 9px rgba(255,211,90,.95)}
.pc.pglow.r4 .tc{box-shadow:0 0 32px 12px rgba(255,111,216,.95)}
.pc.pglow{animation:flp .36s ease-in-out,pop .8s .36s ease-out}
@keyframes pop{30%{transform:scale(1.2)}}
.po-msg{text-align:center;font-size:14px;line-height:1.7}
.po-msg p{margin:0 0 6px}
</style>
</head>
<body>
<div id="xmas" aria-hidden="true"></div>
<canvas id="dust" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<header>
 <div class="brand">✦ ARCANA ✦</div>
 <h1>ไพ่ทาโรต์กระจกสีโฮโลแกรม</h1>
 <div class="info" id="info"></div>
</header>
<main class="stage" id="stage">
 <div class="glow"></div>
 <div class="aura" id="aura"></div>
 <div class="rays" id="rays"></div>
 <div class="shock" id="shock"></div>
 <div class="beam" id="beam"></div>
 <div class="xmas-banner" id="xmasBanner">🎄 Merry Christmas 🎄</div>
 <img class="spirit" id="spirit" alt="" aria-hidden="true">
 <div class="card" id="card" tabindex="0" role="button" aria-label="ไพ่ทาโรต์ แตะเพื่อเปิดคำทำนาย">
  <div class="float idle" id="float">
   <div class="tilt">
    <div class="spin">
     <div class="edge" style="transform:translateZ(-2px)"></div>
     <div class="edge" style="transform:translateZ(-1px)"></div>
     <div class="edge" style="transform:translateZ(0)"></div>
     <div class="edge" style="transform:translateZ(1px)"></div>
     <div class="edge" style="transform:translateZ(2px)"></div>
     <div class="face back"><img id="backImg" alt=""></div>
     <div class="face front" id="front">
      <img id="art" alt="">
      <div class="holo rainbow"></div><div class="holo irid"></div><div class="holo sparkle"></div>
      <div class="holo scan"></div><div class="holo band"></div><div class="holo spot"></div>
      <div id="twinkles"></div>
      <div class="sweep" id="sweep"></div>
      <div class="numeral" id="numeral"></div>
      <div class="name"><span id="name"></span></div>
      <div class="fortune" id="fortune"><span id="ftext"></span></div>
     </div>
    </div>
   </div>
  </div>
 </div>
 <button type="button" class="pile empty" id="pile"><div class="pile-stack"></div><span class="pile-n">0</span><span class="pile-label">กองที่สุ่มแล้ว</span></button>
 <div class="arcfx" id="arcfx" aria-hidden="true"><div class="rainbow-arc"></div><div class="ring" id="ring"></div></div>
 <div class="arc-ptr" id="arcPtr" aria-hidden="true">▼</div>
 <canvas id="three3d" aria-hidden="true"></canvas>
 <div class="wan-tag chibi-tag" id="chibiTag">✨ น้องหวาน ✨</div>
</main>
<footer>
  <div class="deck-left" id="deckLeft"></div>
 <p class="hint" id="hint">แตะไพ่เพื่อเปิดคำทำนาย</p>
 <div class="btns">
  <button id="shuffleBtn" class="primary" type="button"><span class="ic">🔮</span> สุ่มไพ่</button>
 </div>
</footer>
<div class="hist" id="hist" hidden><div class="hist-box"><div class="hist-h"><b></b><button type="button" class="hist-close">✕ ปิด</button></div><div class="hist-list"></div></div></div>
<div id="toast" role="status"></div>
<div class="sr" aria-live="polite" id="live"></div>

 setTimeout(()=>{fly.remove();renderPile();pileEl.classList.remove('bump');void pileEl.offsetWidth;pileEl.classList.add('bump');done()},720)}
pileEl.addEventListener('click',()=>{if(!pileHist.length)return;
 histEl.querySelector('.hist-h b').textContent=`ไพ่ที่สุ่มแล้ว ${pileHist.length} / ${deck.length} ใบ`;
 histEl.querySelector('.hist-list').innerHTML=pileHist.slice().reverse().map((h,k)=>{const c=deck[h.idx];
  return`<div class="hist-item"><img src="${faceURL(h.idx)}" alt=""><div><b>${pileHist.length-k}. ${c.th}</b><small>${c.en}</small><p>${h.text}</p></div></div>`}).join('');
 histEl.hidden=false});
histEl.addEventListener('click',e=>{if(e.target===histEl||e.target.closest('.hist-close'))histEl.hidden=true});
renderPile();
if(location.hash.includes('again'))setTimeout(()=>shuffle(),9000);
if(location.hash.includes('histopen'))setTimeout(()=>pileEl.click(),11000); // test hook // test hook: second draw -> first card goes to the pile

// =====================================================================================================
// item 18: TCG model — 5 grades C/R/SR/UR/SP (SR and above are foil), random 5-card packs 49฿, Box, Box set,
//          singles in a shop display case priced at the per-card pack price +10% compounded per tier.
// item 20: the card picker is back.
// item 19: window.exportCardJPG(i, 'front'|'back') renders print-ready JPGs (used by tools/export_cards.cjs).
// Everything here is a simulation (no real payment); the collection is kept in this browser only.
// =====================================================================================================
const RAR=[{k:'C',th:'ธรรมดา',star:'●',col:'#d7dcea'},{k:'R',th:'หายาก',star:'◆',col:'#5fb4ff'},
 {k:'SR',th:'หายากมาก',star:'★',col:'#b58cff',foil:1},{k:'UR',th:'หายากสุดๆ',star:'★★',col:'#ffd35a',foil:1},{k:'SP',th:'พิเศษ',star:'✦',col:'#ff6fd8',foil:1}];
// rarity is set per deity in 4_deities.js
const TIER=[0,1,2,3,4].map(t=>deck.map((_,i)=>i).filter(i=>deck[i].rar===t));
const PACK_PRICE=49,PACK_SIZE=5,PER_CARD=PACK_PRICE/PACK_SIZE,BOX_PACKS=20;
const exactPrice=t=>PER_CARD*Math.pow(1.1,t+1);        // 9.80 × 1.1^(tier+1): +10% compounded per rarity step
const priceOf=t=>Math.ceil(exactPrice(t));              // shelf price rounded up to whole baht
const SET_PRICE=deck.reduce((a,c)=>a+priceOf(c.rar),0);
const baht=n=>n.toLocaleString('th-TH')+'฿';
const thumb=(i,extra='')=>{const t=deck[i].rar,R=RAR[t];return`<div class="tc r${t}" title="${deck[i].th} · ${R.th}"><img src="${faceURL(i)}" alt="${deck[i].th}" loading="lazy"><span class="rb">${R.star} ${R.k}</span>${extra}</div>`};

// ---------- collection (per-viewer, this browser only) ----------
let COL={own:{},spent:0};
try{const s=JSON.parse(localStorage.getItem('arcana_col')||'null');if(s&&s.own)COL=s}catch(_){}
const saveCol=()=>{try{localStorage.setItem('arcana_col',JSON.stringify(COL))}catch(_){}};
const ownedKinds=()=>Object.keys(COL.own).filter(k=>COL.own[k]>0).length;
function addCards(ids,cost){const fresh=new Set();ids.forEach(i=>{if(!COL.own[i])fresh.add(i);COL.own[i]=(COL.own[i]||0)+1});COL.spent+=cost;saveCol();updSpent();return fresh}

// ---------- grade on the big card: badge + foil that gets stronger with each grade ----------
const cbadge=document.createElement('div');cbadge.className='cbadge';front.appendChild(cbadge);
const _applyCard=applyCard;
applyCard=function(i){_applyCard(i);const R=RAR[deck[i].rar];info.textContent+=` · ${R.star} ${R.th}`;
 cbadge.textContent=`${R.star} ${R.k}`;cbadge.style.color=R.col;['r','sr','ur','sp'].forEach((n,k)=>front.classList.toggle('foil-'+n,deck[i].rar===k+1))};
applyCard(cur);

// ---------- overlays ----------
function overlay(id,title){const o=document.createElement('div');o.className='ovl';o.id=id;o.hidden=true;
 o.innerHTML=`<div class="ovl-box"><div class="ovl-h"><b>${title}</b><span class="ovl-sub"></span><button type="button" class="ovl-x">✕ ปิด</button></div><div class="ovl-tabs"></div><div class="ovl-body"></div></div>`;
 document.body.appendChild(o);o.addEventListener('click',e=>{if(e.target===o||e.target.closest('.ovl-x'))o.hidden=true});return o}
const btns=document.querySelector('.btns');
const mkBtn=(txt,fn)=>{const b=document.createElement('button');b.type='button';b.innerHTML=txt;b.addEventListener('click',fn);btns.appendChild(b);return b};

// ---------- item 20: pick any card ----------
const pk=overlay('pickOv','🃏 เลือกไพ่ที่อยากเปิด');
function openPicker(){const groups=CATS.map((c,k)=>[c.th,deck.map((_,i)=>i).filter(i=>deck[i].cat===k)]).filter(g=>g[1].length);
 pk.querySelector('.ovl-sub').textContent='แตะไพ่ 1 ใบ';
 pk.querySelector('.ovl-body').innerHTML=groups.map(([t,ids])=>`<h3>${t}</h3><div class="tgrid">${ids.map(i=>`<button type="button" class="tbtn" data-i="${i}">${thumb(i)}<span class="tn">${deck[i].th}</span></button>`).join('')}</div>`).join('');
 pk.hidden=false}
pk.querySelector('.ovl-body').addEventListener('click',e=>{const b=e.target.closest('.tbtn');if(!b)return;pk.hidden=true;pickCard(+b.dataset.i)});
function pickCard(i){if(busy||spinning||(X3&&X3.state()!=='none'&&X3.state()!=='ready')){toast('รอให้เปิดไพ่ใบนี้เสร็จก่อนนะ');return}
 const go=()=>{const k=bag.indexOf(i);if(k>=0)bag.splice(k,1);deckLeft.textContent=`🃏 เหลือในสำรับ ${bag.length}/${deck.length} ใบ`;busy=true;
  collect(()=>{applyCard(i);showCardEl();finish({to:i,text:pickF(i),reveal:true,big:true});busy=false})};
 if(X3&&X3.state()==='ready')X3.hideSpread(go);else go()}
mkBtn('🃏 เลือกไพ่',openPicker);

// ---------- item 18: the shop ----------
const sh=overlay('shopOv','🛍️ ร้านการ์ด ARCANA');
const TABS=[['pack','🎁 ซองสุ่ม'],['box','📦 Box'],['set','🗃️ Box set'],['single','🏪 ตู้โชว์ปลีก'],['col','📚 คอลเลกชัน']];
sh.querySelector('.ovl-tabs').innerHTML=TABS.map(([k,t])=>`<button type="button" data-tab="${k}">${t}</button>`).join('');
const shBody=sh.querySelector('.ovl-body');let tab='pack',filt=-1;
function updSpent(){sh.querySelector('.ovl-sub').textContent=`ยอดซื้อจำลอง ${baht(COL.spent)} · สะสม ${ownedKinds()}/${deck.length}`}
const rarTable=()=>`<table class="rtab"><tr><th>ระดับ</th><th>ไพ่</th><th>จำนวน</th><th>ราคาปลีก/ใบ</th></tr>${RAR.map((R,t)=>`<tr>
 <td><span class="chip r${t}">${R.star} ${R.k}</span> ${R.th}${R.foil?' · ฟอยล์':''}</td><td>${['เทพองค์รอง','เทพที่คนรู้จัก','เทพเด่น','เทพผู้ยิ่งใหญ่','ที่สุดของหมวด'][t]}</td>
 <td>${TIER[t].length}</td><td><b>${baht(priceOf(t))}</b> <small>(${exactPrice(t).toFixed(2)})</small></td></tr>`).join('')}</table>
 <p class="note">เกรดจัดตามความดังของแต่ละองค์ — ทุกหมวด (ความมั่งคั่ง · สติปัญญา · ความรัก · แสงสว่าง · ความกล้าหาญ · สุขภาพ) มีครบ C / R / SR / UR / SP</p>
 <p class="note">ราคาหน้าซองต่อใบ = 49 ÷ 5 = 9.80฿ · ราคาปลีก = 9.80 × 1.1 ยกกำลัง (ระดับ) — บวก 10% ทบทุกระดับ แล้วปัดขึ้นเป็นบาท</p>`;
function packCards(){const p=[];for(let k=0;k<3;k++)p.push(0);p.push(1);{const q=Math.random();p.push(q<.70?2:q<.94?3:4)} // chase slot: SR 70% · UR 24% · SP 6%
 
 return p.map(t=>TIER[t][Math.floor(Math.random()*TIER[t].length)])}
function render(){sh.querySelectorAll('.ovl-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));updSpent();
 if(tab==='pack')shBody.innerHTML=`<div class="prod"><div class="packart"><span>ARCANA</span><small>BOOSTER · 5 CARDS</small></div><div>
  <h3>ซองสุ่ม 5 ใบ — ${baht(PACK_PRICE)}</h3><p>ในซอง: ● C 3 ใบ · ◆ R 1 ใบ · ช่องลุ้น 1 ใบ (★ SR 70% / ★★ UR 24% / ✦ SP 6%)</p>
  <button type="button" class="buy" data-buy="pack">ซื้อและเปิดซอง ${baht(PACK_PRICE)}</button></div></div>${rarTable()}`;
 else if(tab==='box')shBody.innerHTML=`<div class="prod"><div class="packart box"><span>ARCANA</span><small>BOOSTER BOX · ${BOX_PACKS} PACKS</small></div><div>
  <h3>Box — ${BOX_PACKS} ซอง (${BOX_PACKS*PACK_SIZE} ใบ) ${baht(BOX_PACKS*PACK_PRICE)}</h3><p>เหมือนซื้อ ${BOX_PACKS} ซอง เฉลี่ยได้ ★★ UR / ✦ SP รวม ~${Math.round(BOX_PACKS*.3)} ใบต่อกล่อง</p>
  <button type="button" class="buy" data-buy="box">ซื้อและเปิดทั้งกล่อง ${baht(BOX_PACKS*PACK_PRICE)}</button></div></div>`;
 else if(tab==='set')shBody.innerHTML=`<div class="prod"><div class="packart set"><span>ARCANA</span><small>COMPLETE SET · ${deck.length}</small></div><div>
  <h3>Box set — ครบทั้ง ${deck.length} ใบ ${baht(SET_PRICE)}</h3><p>ได้ทุกใบ 1 ใบ (ใบหายากเป็นฟอยล์) ราคาเท่ากับรวมราคาปลีกทุกใบ</p>
  <button type="button" class="buy" data-buy="set">ซื้อ Box set ${baht(SET_PRICE)}</button></div></div>`;
 else if(tab==='single')shBody.innerHTML=`<div class="chips"><button type="button" data-f="-1" class="${filt<0?'on':''}">ทั้งหมด</button>${RAR.map((R,t)=>`<button type="button" data-f="${t}" class="${filt===t?'on':''}">${R.star} ${R.th}</button>`).join('')}</div>
  <div class="tgrid">${deck.map((c,i)=>filt>=0&&c.rar!==filt?'':`<div class="shelf">${thumb(i)}<span class="tn">${c.th}</span><button type="button" class="buy sm" data-one="${i}">ซื้อ ${baht(priceOf(c.rar))}</button>${COL.own[i]?`<span class="own">มีแล้ว ×${COL.own[i]}</span>`:''}</div>`).join('')}</div>`;
 else shBody.innerHTML=`<p class="note">สะสมแล้ว ${ownedKinds()}/${deck.length} ชนิด · ยอดซื้อจำลอง ${baht(COL.spent)}</p>
  <div class="tgrid">${deck.map((c,i)=>`<div class="shelf ${COL.own[i]?'':'miss'}">${thumb(i)}<span class="tn">${c.th}</span>${COL.own[i]?`<span class="own">×${COL.own[i]}</span>`:''}</div>`).join('')}</div>
  ${ownedKinds()?'<button type="button" class="buy sm ghost" data-reset="1">ล้างคอลเลกชัน</button>':''}`}
sh.querySelector('.ovl-tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){tab=b.dataset.tab;render()}});
shBody.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.f!==undefined){filt=+b.dataset.f;render()}
 else if(b.dataset.one!==undefined){const i=+b.dataset.one;addCards([i],priceOf(deck[i].rar));toast(`ซื้อ ${deck[i].th} แล้ว`);render()}
 else if(b.dataset.buy==='pack')openPack();
 else if(b.dataset.buy==='box'){const all=[];for(let k=0;k<BOX_PACKS;k++)all.push(...packCards());showHaul('📦 เปิด Box แล้ว',all,addCards(all,BOX_PACKS*PACK_PRICE))}
 else if(b.dataset.buy==='set'){const all=deck.map((_,i)=>i);showHaul(`🗃️ ได้ Box set ครบ ${deck.length} ใบ`,all,addCards(all,SET_PRICE))}
 else if(b.dataset.reset){COL={own:{},spent:0};saveCol();render()}
 else if(b.dataset.again){openPack()}else if(b.dataset.back){render()}});
function showHaul(title,ids,fresh){const cnt={};ids.forEach(i=>cnt[i]=(cnt[i]||0)+1);const uniq=Object.keys(cnt).map(Number).sort((a,b)=>deck[b].rar-deck[a].rar||a-b);
 const per=[0,1,2,3,4].map(t=>ids.filter(i=>deck[i].rar===t).length);
 shBody.innerHTML=`<h3>${title}</h3><p class="note">${RAR.map((R,t)=>`${R.star} ${R.th} ${per[t]}`).join(' · ')} · ใบใหม่ ${fresh.size} ชนิด</p>
  <div class="tgrid">${uniq.map(i=>`<div class="shelf">${thumb(i,fresh.has(i)?'<span class="new">NEW</span>':'')}<span class="tn">${deck[i].th}${cnt[i]>1?` ×${cnt[i]}`:''}</span></div>`).join('')}</div>
  <button type="button" class="buy" data-back="1">กลับร้าน</button>`}

// pack opening: tap to tear the pack, the 5 cards flip one by one (rare ones last, with foil + glow)
function openPack(){const ids=packCards(),fresh=addCards(ids,PACK_PRICE);
 shBody.innerHTML=`<div class="po"><div class="po-pack"><div class="po-top"></div><span>ARCANA</span><small>แตะเพื่อฉีกซอง</small></div>
  <div class="po-cards">${ids.map((i,k)=>`<div class="pc r${deck[i].rar}" style="--k:${k}"><div class="pc-in"><img class="pc-b" src="${$('#backImg').src}" alt=""><div class="pc-f">${thumb(i,fresh.has(i)?'<span class="new">NEW</span>':'')}</div></div></div>`).join('')}</div>
  <div class="po-msg"></div></div>`;
 const po=shBody.querySelector('.po'),pack=po.querySelector('.po-pack');let opened=false;
 const tear=()=>{if(opened)return;opened=true;po.classList.add('torn');
  po.querySelectorAll('.pc').forEach((el,k)=>setTimeout(()=>{el.classList.add(deck[ids[k]].rar>=2?'pglow':'flipping');setTimeout(()=>el.classList.add('flip'),180)},700+k*520));
  setTimeout(()=>{po.querySelector('.po-msg').innerHTML=`<p>${ids.map(i=>`${RAR[deck[i].rar].star} ${deck[i].th}`).join(' · ')}</p>
   <button type="button" class="buy" data-again="1">เปิดอีกซอง ${baht(PACK_PRICE)}</button> <button type="button" class="buy ghost" data-back="1">กลับร้าน</button>`},700+5*520+300)};
 pack.addEventListener('click',tear);if(location.hash.includes('autotear'))setTimeout(tear,200)}
mkBtn('🛍️ ร้านการ์ด',()=>{sh.hidden=false;render()});

// ---------- item 19: print-ready JPG of a card's front or back ----------
window.exportCardJPG=async function(i,side,W){W=W||750;const H=Math.round(W*5/3),c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
 const svg=side==='back'?backSVG():faceSVG(deck[i]),im=new Image();
 await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
 g.fillStyle='#0b0820';g.fillRect(0,0,W,H);g.drawImage(im,0,0,W,H);
 if(side!=='back'){if(document.fonts)await document.fonts.ready;const k=W/300,cd=deck[i],R=RAR[cd.rar];g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#eef1f8';g.font=`700 ${13*k}px Cinzel, serif`;if(cd.roman)g.fillText(cd.roman,150*k,27*k);
  let fs=15;const nf=()=>`700 ${fs*k}px Cinzel, serif`;g.font=nf();while(g.measureText(cd.en).width>236*k&&fs>8){fs-=.5;g.font=nf()}
  g.fillStyle='#f4e7c2';g.shadowColor='rgba(255,210,140,.6)';g.shadowBlur=8*k;g.fillText(cd.en,150*k,427*k);g.shadowBlur=0;
  g.font=`${15*k}px Sriracha, sans-serif`;g.fillStyle='#fff3dc';g.fillText(cd.th,150*k,461*k);
  g.textAlign='right';g.font=`700 ${10*k}px Cinzel, serif`;g.fillStyle=R.col;g.fillText(`${R.star} ${R.k}`,280*k,480*k)}
 return c.toDataURL('image/jpeg',.92)};
if(location.hash.includes('shoptest'))setTimeout(()=>{sh.hidden=false;render();openPack()},300); // test hook
if(location.hash.includes('shopall'))setTimeout(()=>{const out=[];for(const t of ['pack','box','set','single','col']){try{tab=t;render();out.push(t+':'+shBody.querySelectorAll('.tc').length)}catch(e){out.push(t+':ERR '+e.message)}}
 try{shBody.querySelector('[data-buy]');tab='box';render();shBody.querySelector('[data-buy=box]').click();out.push('boxhaul:'+shBody.querySelectorAll('.tc').length)}catch(e){out.push('box ERR '+e.message)}
 try{openPicker();out.push('picker:'+pk.querySelectorAll('.tbtn').length)}catch(e){out.push('picker ERR '+e.message)}
 out.push('price:'+[0,1,2,3,4].map(priceOf).join('/')+' set:'+SET_PRICE+' tiers:'+TIER.map(a=>a.length).join('/'));document.body.setAttribute('data-shop',out.join(' | '))},500); // test hook
if(location.hash.includes('pickone'))setTimeout(()=>{openPicker();pk.querySelector('.tbtn[data-i="40"]').click()},7000); // test hook
</script>
</body>
